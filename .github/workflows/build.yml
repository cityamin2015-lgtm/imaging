name: Build PatternEngine installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build PatternEngine.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PatternEngine pattern_gui.py

      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=1.0.0 installer.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PatternEngine-Setup
          path: installer_output/*.exe
